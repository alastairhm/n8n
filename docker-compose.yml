services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    environment:
      - GENERIC_TIMEZONE=Europe/Amsterdam
      - NODE_ENV=production
      - N8N_SECURE_COOKIE=false
      - N8N_PATH=/n8n/
      - N8N_EDITOR_BASE_URL=http://dell3050.duckdns.org/n8n/
      - N8N_WEBHOOK_URL=http://dell3050.duckdns.org/n8n/
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
    name: n8n_data
    external: true

